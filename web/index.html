<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>singbox-sub-manager</title>


<link rel="stylesheet" href="/web/css/style.css">


</head>


<body>


<div class="container">


<h1>
singbox-sub-manager
</h1>





<div class="card">


<h2>
管理认证
</h2>


<input
id="adminKey"
type="password"
placeholder="输入 ADMIN_KEY"
/>


<button onclick="saveKey()">
保存 KEY
</button>


</div>








<div class="card">


<h2>
节点管理
</h2>


<button onclick="getNodes()">
节点列表
</button>


<button onclick="getNodeCount()">
节点数量
</button>


</div>








<div class="card">


<h2>
模板管理
</h2>


<button onclick="getTemplates()">
模板列表
</button>


</div>








<div class="card">


<h2>
Hosts管理
</h2>


<button onclick="getHosts()">
Hosts列表
</button>


</div>








<div class="card">


<h2>
API返回

</h2>


<pre id="result">
等待操作...
</pre>


</div>





</div>








<script src="/web/js/api.js"></script>

<script src="/web/js/nodes.js"></script>

<script src="/web/js/templates.js"></script>

<script src="/web/js/hosts.js"></script>

<script src="/web/js/app.js"></script>



</body>


</html>
